name: Database Backup

on:
  schedule:
    # 19:00 UTC = 02:00 Asia/Bangkok — runs every day
    - cron: '0 19 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client awscli

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M)
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          pg_dump "$DATABASE_URL" -F c -f "backup_$TIMESTAMP.dump"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}       # e.g. https://<account_id>.r2.cloudflarestorage.com
          R2_BUCKET: zeroplus-db-backups
        run: |
          set -e
          aws s3 cp "backup_${TIMESTAMP}.dump" \
            "s3://${R2_BUCKET}/backup_${TIMESTAMP}.dump" \
            --endpoint-url "$R2_ENDPOINT"

      - name: Delete local dump
        run: rm -f backup_*.dump

      - name: Ping healthcheck (confirms the backup actually ran today)
        if: success()
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECK_PING_URL }}"

      - name: Report failure to healthcheck
        if: failure()
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECK_PING_URL }}/fail"
